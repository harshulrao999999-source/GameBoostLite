name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip GameBoostLite.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.2.1 }
      - run: gradle -p GameBoostLite :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GameBoostLite-apk
          path: GameBoostLite/app/build/outputs/apk/release/*.apk
